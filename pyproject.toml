[project]
name = "accusleepy"
version = "0.13.0"
description = "Python implementation of AccuSleep"
authors = [
    {name = "Zeke Barger",email = "zekebarger@gmail.com"}
]
license = "GPL-3.0-only"
license-files = ["license.txt"]
readme = "README.md"
requires-python = ">=3.11,!=3.14.1,<3.15"
dependencies = [
    "numpy (>=2.4.6,<3.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "torch (>=2.13.0,<3.0.0)",
    "torchvision (>=0.28.0,<1.0.0)",
    "scipy (>=1.17.1,<2.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "tqdm (>=4.70.0,<5.0.0)",
    "pyside6 (>=6.11.2,<7.0.0)",
    "pyarrow (>=25.0.1,<26.0.0)",
    "platformdirs (>=4.11.3,<5.0.0)",
]

[tool.poetry.group.dev.dependencies]
pre-commit = ">=4.6.2,<5.0.0"
pytest = ">=9.1.1,<10.0.0"
pytest-qt = ">=4.5.0,<5.0.0"
ruff = ">=0.16.4,<0.17.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
markers = [
    "gui: marks tests as GUI tests (may require display or xvfb)",
    "integration: marks tests as integration tests (may be slower)",
]
qt_api = "pyside6"
